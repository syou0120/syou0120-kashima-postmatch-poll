<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鹿島アントラーズ 試合後アンケート作成ツール</title>
<style>
  :root {
    --bg: #0b1120;
    --card: #111827;
    --input: #030712;
    --border: #334155;
    --red: #991b1b;
    --red-dark: #450a0a;
    --gold: #fbbf24;
    --gold-btn: #f59e0b;
    --green: #059669;
    --text: #f8fafc;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding-bottom: 72px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(90deg, var(--red) 0%, #7f1d1d 60%, var(--red-dark) 100%);
    border-bottom: 1px solid rgba(251, 191, 36, 0.35);
    padding: 10px 14px;
  }
  .header-inner {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  h1 { margin: 0; font-size: 16px; font-weight: 900; color: #fff; }
  .sub { margin: 0; font-size: 11px; color: #fde68a; }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  section {
    background: var(--card);
    border: 1px solid #1e293b;
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  section.highlight { border: 2px solid rgba(251, 191, 36, 0.55); }
  h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 900;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .bar { width: 5px; height: 16px; border-radius: 99px; display: inline-block; }
  .bar-red { background: #dc2626; }
  .bar-gold { background: var(--gold); }
  .bar-green { background: #10b981; }
  label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    padding: 9px 11px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--input);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
  }
  textarea { font-weight: 500; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
  button {
    cursor: pointer;
    font-family: inherit;
    font-weight: 800;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--input);
    color: #e2e8f0;
    padding: 8px 10px;
    font-size: 12px;
    touch-action: manipulation;
  }
  button:active { transform: scale(0.98); }
  button.active-red { background: #b91c1c; color: #fff; border-color: var(--gold); }
  button.active-gold { background: var(--gold-btn); color: #090d16; border-color: #fde68a; }
  button.active-green { background: var(--green); color: #fff; border-color: #6ee7b7; }
  .btn-reset { background: rgba(0,0,0,0.6); color: #fff; border-color: rgba(255,255,255,0.25); padding: 6px 10px; font-size: 11px; }
  .btn-gold { background: var(--gold-btn); color: #090d16; border: none; font-weight: 900; }
  .btn-yt {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #b91c1c;
    color: #fff;
    font-weight: 900;
    font-size: 13px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(251, 191, 36, 0.45);
  }
  .row-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  @media (min-width: 480px) { .grid-4 { grid-template-columns: repeat(4, 1fr); } }
  .flex-row { display: flex; align-items: center; gap: 6px; }
  .score-box {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 5px 8px;
  }
  .score-box input { width: 46px; text-align: center; padding: 6px 4px; font-size: 15px; }
  .opt-num {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: #1e293b;
    color: var(--gold);
    font-weight: 900;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  pre {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.55;
    color: #fff;
  }
  .copy-opt-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    text-align: left;
  }
  .badge-red { background: #991b1b; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 6px; flex-shrink: 0; }
  .modal-bg {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0, 0, 0, 0.82);
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-bg.open { display: flex; }
  @media (min-width: 540px) { .modal-bg { align-items: center; padding: 16px; } }
  .modal-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 500px;
    max-height: 85vh;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  @media (min-width: 540px) { .modal-card { border-radius: 18px; } }
